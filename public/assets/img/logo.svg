<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 48" role="img" aria-label="JahitFlow">
  <!-- Ikon: jarum jahit + garis jahitan mengalir -->
  <g stroke-linecap="round">
    <!-- Jarum -->
    <line x1="10" y1="36" x2="30" y2="12" stroke="#1e3a5f" stroke-width="2.6"/>
    <!-- Lubang jarum -->
    <ellipse cx="28.4" cy="14.4" rx="1.5" ry="2.4" transform="rotate(38 28.4 14.4)" fill="none" stroke="#1e3a5f" stroke-width="1.4"/>
    <!-- Benang / running stitch -->
    <path d="M29 16 C 33 24, 24 26, 27 33 S 40 34, 43 27" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-dasharray="5.5 5"/>
  </g>
  <!-- Wordmark -->
  <text x="52" y="31" font-family="'Segoe UI', 'Inter', system-ui, sans-serif" font-size="21" letter-spacing="-0.3">
    <tspan font-weight="700" fill="#1e3a5f">Jahit</tspan><tspan font-weight="400" fill="#0d9488">Flow</tspan>
  </text>
</svg>
